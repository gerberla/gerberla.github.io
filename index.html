<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly.js 3D Octree Demos</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1f2527;
            color: #ffffff;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3436;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid #444;
            box-sizing: border-box;
            transition: transform 0.3s ease;
            position: relative;
        }
        .sidebar.collapsed {
            transform: translateX(-100%);
        }
        .sidebar h2 {
            margin: 0 0 20px;
            font-size: 1.5em;
        }
        .toggle-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: #66b3ff;
            border: none;
            color: #1f2527;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
        }
        .hamburger {
            display: none;
            background: #66b3ff;
            border: none;
            color: #1f2527;
            padding: 10px;
            font-size: 1.2em;
            cursor: pointer;
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            border-radius: 4px;
        }
        .menu-item {
            margin: 10px 0;
        }
        .menu-item button {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1em;
            cursor: pointer;
            padding: 8px 12px;
            width: 100%;
            text-align: left;
            transition: background-color 0.2s;
            border-radius: 4px;
        }
        .menu-item button:hover {
            background-color: #3a4446;
        }
        .menu-item button.active {
            background-color: #66b3ff;
            color: #1f2527;
        }
        .submenu {
            margin-left: 20px;
            display: none;
        }
        .submenu.visible {
            display: block;
        }
        .content {
            flex: 1;
            padding: 20px;
            background-color: #1f2527;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            transition: margin-left 0.3s ease;
        }
        .content h1 {
            margin: 0 0 20px;
            font-size: 1.8em;
        }
        iframe {
            width: 100%;
            height: calc(100% - 40px);
            border: none;
            background-color: #ffffff;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                width: 250px;
                z-index: 999;
                transform: translateX(-100%);
            }
            .sidebar.visible {
                transform: translateX(0);
            }
            .hamburger {
                display: block;
            }
            .toggle-btn {
                display: block;
            }
            .content {
                margin-left: 0;
                padding: 10px;
            }
            .content h1 {
                font-size: 1.4em;
            }
            .menu-item button {
                font-size: 0.9em;
                padding: 10px;
            }
        }

        /* Tablet Styles */
        @media (min-width: 769px) and (max-width: 1024px) {
            .sidebar {
                width: 200px;
            }
            .content {
                padding: 15px;
            }
            .content h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="hamburger" aria-label="Toggle Sidebar">☰</button>
        <div class="sidebar" id="sidebar">
            <button class="toggle-btn" aria-label="Collapse Sidebar">Collapse</button>
            <h2>Demos</h2>
            <div id="menu"></div>
        </div>
        <div class="content">
            <h1 id="demo-title">Select a Demo</h1>
            <iframe id="demo-frame" src=""></iframe>
        </div>
    </div>

    <script>
        const demos = [
            { path: 'Prototypes/Base/original.html', name: 'Original 3D Octree', folder: 'Prototypes/Base' },
            { path: 'Prototypes/Base/optimized.html', name: 'Optimized 3D Octree', folder: 'Prototypes/Base' },
            { path: 'Prototypes/Features/glb-upload.html', name: 'GLB Upload', folder: 'Prototypes/Features' },
            { path: 'Prototypes/Features/realtime-slider.html', name: 'Realtime Slider', folder: 'Prototypes/Features' },
            { path: 'Prototypes/Features/interpolated-glb.html', name: 'Interpolated GLB', folder: 'Prototypes/Features' },
            { path: 'Prototypes/Visuals/heatmap.html', name: 'Heatmap Cross-Section', folder: 'Prototypes/Visuals' },
            { path: 'Prototypes/Visuals/thickness-slider.html', name: 'Thickness Slider', folder: 'Prototypes/Visuals' },
            { path: 'fft/grok_fft_6.html', name: 'FFT', folder: 'fft' }
        ];

        const folders = {};
        demos.forEach(demo => {
            const folder = demo.folder || 'Uncategorized';
            if (!folders[folder]) folders[folder] = [];
            folders[folder].push(demo);
        });

        const menu = document.getElementById('menu');
        Object.keys(folders).forEach(folder => {
            const folderDiv = document.createElement('div');
            folderDiv.className = 'menu-item';

            const folderButton = document.createElement('button');
            folderButton.textContent = folder.split('/').pop();
            folderButton.setAttribute('aria-expanded', 'false');
            folderButton.addEventListener('click', () => {
                const submenu = folderDiv.querySelector('.submenu');
                submenu.classList.toggle('visible');
                folderButton.setAttribute('aria-expanded', submenu.classList.contains('visible'));
            });
            folderDiv.appendChild(folderButton);

            const submenu = document.createElement('div');
            submenu.className = 'submenu';
            folders[folder].forEach(demo => {
                const demoButton = document.createElement('button');
                demoButton.textContent = demo.name;
                demoButton.addEventListener('click', () => {
                    loadDemo(demo.path, demo.name);
                    updateActiveButton(demoButton);
                    if (window.innerWidth <= 768) {
                        toggleSidebar(); // Close sidebar on mobile after selection
                    }
                });
                submenu.appendChild(demoButton);
            });
            folderDiv.appendChild(submenu);

            menu.appendChild(folderDiv);
        });

        function loadDemo(path, name) {
            const iframe = document.getElementById('demo-frame');
            iframe.src = path;
            document.getElementById('demo-title').textContent = name;
        }

        function updateActiveButton(selectedButton) {
            document.querySelectorAll('.menu-item button').forEach(btn => {
                btn.classList.remove('active');
            });
            selectedButton.classList.add('active');
        }

        // Sidebar toggle functionality
        const sidebar = document.getElementById('sidebar');
        const hamburger = document.querySelector('.hamburger');
        const toggleBtn = document.querySelector('.toggle-btn');

        function toggleSidebar() {
            sidebar.classList.toggle('visible');
            sidebar.classList.toggle('collapsed');
            hamburger.setAttribute('aria-expanded', sidebar.classList.contains('visible'));
        }

        hamburger.addEventListener('click', toggleSidebar);
        toggleBtn.addEventListener('click', toggleSidebar);

        // Load first demo by default
        if (demos.length > 0) {
            loadDemo(demos[0].path, demos[0].name);
            updateActiveButton(menu.querySelector('.submenu button'));
            menu.querySelector('.submenu').classList.add('visible');
            menu.querySelector('.menu-item button').setAttribute('aria-expanded', 'true');
        }

        // Adjust sidebar state on resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('collapsed', 'visible');
            } else {
                sidebar.classList.add('collapsed');
                sidebar.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
