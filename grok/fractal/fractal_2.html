<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoomable Fractal Explorer</title>
    <style>
        canvas { border: 1px solid black; }
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; }
        #menu { position: absolute; top: 10px; left: 10px; color: white; font-family: Arial, sans-serif; }
        select { padding: 5px; background: #222; color: white; border: 1px solid #555; }
    </style>
</head>
<body>
    <div id="menu">
        <label for="fractalSelect">Fractal Type: </label>
        <select id="fractalSelect">
            <option value="mandelbrot">Mandelbrot</option>
            <option value="julia">Julia</option>
            <option value="burningShip">Burning Ship</option>
        </select>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');
        const fractalSelect = document.getElementById('fractalSelect');

        if (!gl) {
            alert('WebGL not supported!');
        }

        // Vertex Shader (same for all fractals)
        const vsSource = `
            attribute vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        // Fragment Shader Templates
        const fractalShaders = {
            mandelbrot: `
                precision highp float;
                uniform vec2 u_resolution;
                uniform vec2 u_zoomCenter;
                uniform float u_zoomScale;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.263, 0.416, 0.557);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution;
                    vec2 c = u_zoomCenter + (uv * 4.0 - 2.0) * u_zoomScale;
                    vec2 z = vec2(0.0);
                    float i = 0.0;
                    float maxIter = 100.0;
                    for (int iter = 0; iter < 100; iter++) {
                        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
                        if (length(z) > 2.0) {
                            i = float(iter);
                            break;
                        }
                        i = float(iter) + 1.0;
                    }
                    float t = i / maxIter;
                    vec3 color = (i >= maxIter) ? vec3(0.0) : palette(t);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            julia: `
                precision highp float;
                uniform vec2 u_resolution;
                uniform vec2 u_zoomCenter;
                uniform float u_zoomScale;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.263, 0.416, 0.557);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution;
                    vec2 z = u_zoomCenter + (uv * 4.0 - 2.0) * u_zoomScale;
                    vec2 c = vec2(-0.8, 0.156); // Fixed Julia constant
                    float i = 0.0;
                    float maxIter = 100.0;
                    for (int iter = 0; iter < 100; iter++) {
                        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
                        if (length(z) > 2.0) {
                            i = float(iter);
                            break;
                        }
                        i = float(iter) + 1.0;
                    }
                    float t = i / maxIter;
                    vec3 color = (i >= maxIter) ? vec3(0.0) : palette(t);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            burningShip: `
                precision highp float;
                uniform vec2 u_resolution;
                uniform vec2 u_zoomCenter;
                uniform float u_zoomScale;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.263, 0.416, 0.557);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution;
                    vec2 c = u_zoomCenter + (uv * 4.0 - 2.0) * u_zoomScale;
                    vec2 z = vec2(0.0);
                    float i = 0.0;
                    float maxIter = 100.0;
                    for (int iter = 0; iter < 100; iter++) {
                        z = vec2(abs(z.x), abs(z.y)); // Burning Ship twist
                        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
                        if (length(z) > 2.0) {
                            i = float(iter);
                            break;
                        }
                        i = float(iter) + 1.0;
                    }
                    float t = i / maxIter;
                    vec3 color = (i >= maxIter) ? vec3(0.0) : palette(t);
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };

        // Compile Shader
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        // Program management
        let currentProgram = null;
        let vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);

        function setFractal(fractalType) {
            if (currentProgram) {
                gl.deleteProgram(currentProgram);
            }
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fractalShaders[fractalType]);
            if (!fragmentShader) {
                throw new Error('Fragment shader creation failed');
            }
            currentProgram = gl.createProgram();
            gl.attachShader(currentProgram, vertexShader);
            gl.attachShader(currentProgram, fragmentShader);
            gl.linkProgram(currentProgram);
            if (!gl.getProgramParameter(currentProgram, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(currentProgram));
                throw new Error('Program linking failed');
            }
            gl.useProgram(currentProgram);
            setupAttributesAndUniforms();
            render();
        }

        function setupAttributesAndUniforms() {
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(currentProgram, 'a_position');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            resolutionLocation = gl.getUniformLocation(currentProgram, 'u_resolution');
            zoomCenterLocation = gl.getUniformLocation(currentProgram, 'u_zoomCenter');
            zoomScaleLocation = gl.getUniformLocation(currentProgram, 'u_zoomScale');
        }

        let resolutionLocation, zoomCenterLocation, zoomScaleLocation;
        let zoomCenter = [-0.5, 0.0];
        let zoomScale = 1.0;

        // Mouse interaction
        let isDragging = false;
        let lastX, lastY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = (e.clientX - lastX) * zoomScale * 4 / canvas.width;
                const dy = (lastY - e.clientY) * zoomScale * 4 / canvas.height;
                zoomCenter[0] -= dx;
                zoomCenter[1] -= dy;
                lastX = e.clientX;
                lastY = e.clientY;
                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
            zoomScale *= zoomFactor;
            render();
        });

        fractalSelect.addEventListener('change', (e) => {
            setFractal(e.target.value);
            zoomCenter = (e.target.value === 'julia') ? [0.0, 0.0] : [-0.5, 0.0]; // Reset center for Julia
            zoomScale = 1.0; // Reset zoom
            render();
        });

        function render() {
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform2f(zoomCenterLocation, zoomCenter[0], zoomCenter[1]);
            gl.uniform1f(zoomScaleLocation, zoomScale);

            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        // Initial setup
        setFractal('mandelbrot');
    </script>
</body>
</html>
