<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoomable Mandelbrot Set</title>
    <style>
        canvas { border: 1px solid black; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            alert('WebGL not supported!');
        }

        // Vertex Shader
        const vsSource = `
            attribute vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        // Fragment Shader (Mandelbrot calculation)
        const fsSource = `
            precision highp float;
            uniform vec2 u_resolution;
            uniform vec2 u_zoomCenter;
            uniform float u_zoomScale;

            vec3 palette(float t) {
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.263, 0.416, 0.557);
                return a + b * cos(6.28318 * (c * t + d));
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / u_resolution;
                vec2 c = u_zoomCenter + (uv * 4.0 - 2.0) * u_zoomScale;
                vec2 z = vec2(0.0);
                float i = 0.0;
                float maxIter = 100.0;
                for (int iter = 0; iter < 100; iter++) {
                    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
                    if (length(z) > 2.0) {
                        i = float(iter);
                        break;
                    }
                    i = float(iter) + 1.0;
                }
                float t = i / maxIter;
                vec3 color = (i >= maxIter) ? vec3(0.0) : palette(t);
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // Compile Shader
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

        if (!vertexShader || !fragmentShader) {
            throw new Error('Shader creation failed');
        }

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program link error:', gl.getProgramInfoLog(program));
            throw new Error('Program linking failed');
        }
        gl.useProgram(program);

        // Set up vertices for a full-screen quad
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // Uniforms
        const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
        const zoomCenterLocation = gl.getUniformLocation(program, 'u_zoomCenter');
        const zoomScaleLocation = gl.getUniformLocation(program, 'u_zoomScale');

        let zoomCenter = [-0.5, 0.0];
        let zoomScale = 1.0;

        // Mouse interaction
        let isDragging = false;
        let lastX, lastY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = (e.clientX - lastX) * zoomScale * 4 / canvas.width;
                const dy = (lastY - e.clientY) * zoomScale * 4 / canvas.height;
                zoomCenter[0] -= dx;
                zoomCenter[1] -= dy;
                lastX = e.clientX;
                lastY = e.clientY;
                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
            zoomScale *= zoomFactor;
            render();
        });

        function render() {
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform2f(zoomCenterLocation, zoomCenter[0], zoomCenter[1]);
            gl.uniform1f(zoomScaleLocation, zoomScale);

            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        render();
    </script>
</body>
</html>
