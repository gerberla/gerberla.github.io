<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Multi-Neuron with ReLU</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div id="plot" style="width: 100%; height: 100vh;"></div>
    <button onclick="toggleView()">Toggle Orthographic View</button>

    <script>
        // First neuron data
        let x1 = [];
        let y1 = [];
        let z1 = [];
        for (let i = -5; i <= 5; i += 0.5) {
            x1.push(i);
            y1.push([]);
            z1.push([]);
            for (let j = 0.5; j <= 2; j += 0.1) {
                y1[x1.length - 1].push(j);
                let weightedSum = i * j;
                z1[x1.length - 1].push(Math.max(0, weightedSum)); // ReLU
            }
        }

        // Second neuron data (using first neuron's output as input)
        let x2 = [];
        let y2 = [];
        let z2 = [];
        for (let i = 0; i < z1.length; i++) {
            x2.push(x1[i]); // Same input range for simplicity
            y2.push([]);
            z2.push([]);
            for (let j = 0.5; j <= 2; j += 0.1) {
                y2[x2.length - 1].push(j + 3); // Offset y to separate layers
                let prevOutput = z1[i][Math.floor((j - 0.5) / 0.1)]; // Match index
                let weightedSum = prevOutput * j; // Second neuron's w * input
                z2[x2.length - 1].push(Math.max(0, weightedSum)); // ReLU
            }
        }

        // Data for Plotly
        let data = [
            {
                x: x1,
                y: y1[0],
                z: z1,
                type: 'surface',
                colorscale: 'Viridis',
                name: 'Neuron 1'
            },
            {
                x: x2,
                y: y2[0],
                z: z2,
                type: 'surface',
                colorscale: 'Plasma',
                name: 'Neuron 2'
            }
        ];

        // Layout
        let layout = {
            title: 'Two Neurons with ReLU',
            scene: {
                xaxis: { title: 'Input (x)' },
                yaxis: { title: 'Weight (w) / Layer Offset' },
                zaxis: { title: 'Output' },
                camera: {
                    projection: { type: 'perspective' }
                }
            },
            autosize: true,
            margin: { l: 50, r: 50, b: 50, t: 50 }
        };

        // Render
        Plotly.newPlot('plot', data, layout);

        // Toggle view
        let isOrthographic = false;
        function toggleView() {
            isOrthographic = !isOrthographic;
            let projectionType = isOrthographic ? 'orthographic' : 'perspective';
            Plotly.relayout('plot', {
                'scene.camera.projection.type': projectionType
            });
        }
    </script>
</body>
</html>
