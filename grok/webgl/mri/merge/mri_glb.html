<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Viewer with Three.js</title>
    <style>
        body { 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #viewer-container {
            width: 600px;
            height: 400px;
            position: relative;
            margin-top: 20px;
            border: 1px solid #ccc;
        }
        canvas { 
            display: block; 
            width: 100%;
            height: 100%;
        }
        #upload-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
        }
        #rotation-controls {
            margin: 20px 0;
            text-align: center;
        }
        .slider-container {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 30px;
            text-align: right;
            margin-right: 10px;
        }
        input[type="range"] {
            width: 300px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="upload-container">
            <input type="file" id="fileInput" accept=".glb">
        </div>
    </div>
    <div id="rotation-controls">
        <div class="slider-container">
            <label>X:</label>
            <input type="range" id="xRot" min="-180" max="180" value="0">
            <span id="xValue">0°</span>
        </div>
        <div class="slider-container">
            <label>Y:</label>
            <input type="range" id="yRot" min="-180" max="180" value="0">
            <span id="yValue">0°</span>
        </div>
        <div class="slider-container">
            <label>Z:</label>
            <input type="range" id="zRot" min="-180" max="180" value="0">
            <span id="zValue">0°</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdddddd);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, 600 / 400, 0.1, 1000);
        camera.position.z = 5;

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(600, 400);
        document.getElementById('viewer-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 1);
        scene.add(directionalLight);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // GLTF Loader
        const loader = new GLTFLoader();
        let currentModel = null;

        // Slider elements
        const xSlider = document.getElementById('xRot');
        const ySlider = document.getElementById('yRot');
        const zSlider = document.getElementById('zRot');
        const xValue = document.getElementById('xValue');
        const yValue = document.getElementById('yValue');
        const zValue = document.getElementById('zValue');

        // File input handling
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    loader.parse(arrayBuffer, '', (gltf) => {
                        if (currentModel) {
                            scene.remove(currentModel);
                        }

                        currentModel = gltf.scene;
                        scene.add(currentModel);

                        const box = new THREE.Box3().setFromObject(currentModel);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        
                        currentModel.position.sub(center); // Center the model
                        const maxSize = Math.max(size.x, size.y, size.z);
                        const scale = 4 / maxSize;
                        currentModel.scale.set(scale, scale, scale);
                        
                        camera.position.set(0, 0, Math.max(size.x, size.y, size.z) * 2);
                        controls.target.set(0, 0, 0); // Ensure controls target the center
                        controls.update();

                        // Reset sliders to 0 when loading a new model
                        xSlider.value = 0;
                        ySlider.value = 0;
                        zSlider.value = 0;
                        xValue.textContent = "0°";
                        yValue.textContent = "0°";
                        zValue.textContent = "0°";
                    }, (error) => {
                        console.error('Error loading GLB:', error);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Add slider event listeners to control model rotation
        xSlider.addEventListener('input', () => {
            if (currentModel) {
                currentModel.rotation.x = THREE.MathUtils.degToRad(xSlider.value);
                xValue.textContent = `${parseFloat(xSlider.value).toFixed(1)}°`;
            }
        });

        ySlider.addEventListener('input', () => {
            if (currentModel) {
                currentModel.rotation.y = THREE.MathUtils.degToRad(ySlider.value);
                yValue.textContent = `${parseFloat(ySlider.value).toFixed(1)}°`;
            }
        });

        zSlider.addEventListener('input', () => {
            if (currentModel) {
                currentModel.rotation.z = THREE.MathUtils.degToRad(zSlider.value);
                zValue.textContent = `${parseFloat(zSlider.value).toFixed(1)}°`;
            }
        });

        // Handle window resize (optional: keeping fixed size for now)
        window.addEventListener('resize', () => {
            // For now, we'll keep it fixed at 600x400
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Update sliders based on model rotation (if modified externally, e.g., by OrbitControls or other logic)
            if (currentModel) {
                const xRot = THREE.MathUtils.radToDeg(currentModel.rotation.x);
                const yRot = THREE.MathUtils.radToDeg(currentModel.rotation.y);
                const zRot = THREE.MathUtils.radToDeg(currentModel.rotation.z);

                xSlider.value = xRot;
                ySlider.value = yRot;
                zSlider.value = zRot;
                xValue.textContent = `${xRot.toFixed(1)}°`;
                yValue.textContent = `${yRot.toFixed(1)}°`;
                zValue.textContent = `${zRot.toFixed(1)}°`;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
