<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Viewer with Three.js</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
        }
        canvas { 
            display: block; 
        }
        #upload-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        #rotation-values {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="upload-container">
        <input type="file" id="fileInput" accept=".glb">
    </div>
    <div id="rotation-values">
        X: 0° | Y: 0° | Z: 0°
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdddddd);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 1);
        scene.add(directionalLight);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // GLTF Loader
        const loader = new GLTFLoader();
        let currentModel = null;

        // Rotation display
        const rotationDisplay = document.getElementById('rotation-values');

        // File input handling
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    loader.parse(arrayBuffer, '', (gltf) => {
                        if (currentModel) {
                            scene.remove(currentModel);
                        }

                        currentModel = gltf.scene;
                        scene.add(currentModel);

                        const box = new THREE.Box3().setFromObject(currentModel);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        
                        currentModel.position.sub(center);
                        const maxSize = Math.max(size.x, size.y, size.z);
                        const scale = 4 / maxSize;
                        currentModel.scale.set(scale, scale, scale);
                        
                        camera.position.set(0, 0, Math.max(size.x, size.y, size.z) * 2);
                        controls.update();
                    }, (error) => {
                        console.error('Error loading GLB:', error);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Update rotation values based on camera rotation
            const quaternion = camera.quaternion;
            const euler = new THREE.Euler().setFromQuaternion(quaternion, 'YXZ'); // YXZ order for orbit-style rotation
            const xRot = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
            const yRot = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
            const zRot = THREE.MathUtils.radToDeg(euler.z).toFixed(1);

            // Update display
            rotationDisplay.textContent = `X: ${xRot}° | Y: ${yRot}° | Z: ${zRot}°`;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
