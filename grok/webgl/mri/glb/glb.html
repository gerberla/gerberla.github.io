<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive .glb Viewer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #threeCanvas {
      width: 800px;
      height: 600px;
      border: 1px solid #333;
    }
    #controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .upload-group {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <canvas id="threeCanvas"></canvas>
  <div id="controls">
    <div class="upload-group">
      <label for="gltfUpload">Upload .glb File:</label>
      <input type="file" id="gltfUpload" accept=".glb">
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Three.js Setup
    const canvas = document.getElementById('threeCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(canvas.width, canvas.height);
    renderer.setClearColor(0x333333);

    const controls = new THREE.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    camera.position.set(0, 0, 5);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

    let currentModel = null;

    function loadGLB(file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const loader = new THREE.GLTFLoader();
        loader.parse(event.target.result, '', (gltf) => {
          if (currentModel) {
            scene.remove(currentModel);
          }
          currentModel = gltf.scene;

          // Center and scale the model
          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 5 / maxDim; // Scale to fit within 5 units
          currentModel.scale.set(scale, scale, scale);
          currentModel.position.sub(center.multiplyScalar(scale));

          scene.add(currentModel);
          console.log('Model loaded - Size:', size, 'Scale:', scale, 'Center:', center);

          // Adjust camera position based on model size
          camera.position.set(0, 0, Math.max(5, maxDim * 1.5));
          controls.update();
          controls.reset();
        }, (error) => {
          console.error('Error loading .glb:', error);
          alert('Failed to load the .glb file!');
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // File Upload Event
    const gltfUpload = document.getElementById('gltfUpload');
    gltfUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        loadGLB(file);
      }
    });

    // Render Loop
    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
