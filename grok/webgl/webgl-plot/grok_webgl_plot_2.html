<!DOCTYPE html>
<html>
<head>
  <title>Interactive WebGL Line Plot with Zoom and Axes</title>
  <style>
    canvas { border: 1px solid black; }
    body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
    .controls { margin-top: 10px; }
  </style>
</head>
<body>
  <canvas id="glCanvas" width="800" height="600"></canvas>
  <div class="controls">
    <label>Zoom:</label>
    <input type="range" id="zoomSlider" min="0.5" max="5" value="1" step="0.1" />
    <span id="zoomValue">1.0</span>
  </div>
  <script>
    // Get canvas and WebGL context
    const canvas = document.getElementById('glCanvas');
    const gl = canvas.getContext('webgl');
    if (!gl) {
      alert('WebGL not supported!');
      throw new Error('WebGL not supported');
    }

    // Vertex Shader: Applies translation and scale
    const vertexShaderSource = `
      attribute vec2 a_position;
      uniform vec2 u_translation;
      uniform float u_scale;
      void main() {
        vec2 scaled = a_position * u_scale;
        vec2 translated = scaled + u_translation;
        gl_Position = vec4(translated, 0.0, 1.0);
      }
    `;

    // Fragment Shader: Uses color attribute
    const fragmentShaderSource = `
      precision mediump float;
      uniform vec3 u_color;
      void main() {
        gl_FragColor = vec4(u_color, 1.0);
      }
    `;

    // Create and compile shaders
    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

    // Create shader program
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    // Generate sine wave data
    const numPoints = 100;
    const sinePositions = new Float32Array(numPoints * 2);
    for (let i = 0; i < numPoints; i++) {
      const x = (i / (numPoints - 1)) * 2 - 1; // -1 to 1
      const y = Math.sin(x * Math.PI * 2) * 0.5; // Sine wave, scaled
      sinePositions[i * 2] = x;
      sinePositions[i * 2 + 1] = y;
    }

    // Axis data (x-axis and y-axis lines)
    const axisPositions = new Float32Array([
      -1.0, 0.0,  // x-axis start
       1.0, 0.0,  // x-axis end
       0.0, -1.0, // y-axis start
       0.0,  1.0  // y-axis end
    ]);

    // Buffers
    const sineBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, sineBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, sinePositions, gl.STATIC_DRAW);

    const axisBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, axisBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, axisPositions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);

    // Uniforms
    const translationLoc = gl.getUniformLocation(program, 'u_translation');
    const scaleLoc = gl.getUniformLocation(program, 'u_scale');
    const colorLoc = gl.getUniformLocation(program, 'u_color');
    let translation = [0, 0];
    let scale = 1.0;

    // Mouse interaction
    let isDragging = false;
    let lastX = 0, lastY = 0;

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = (e.clientX - lastX) / canvas.width * 2;
        const dy = (e.clientY - lastY) / canvas.height * -2;
        translation[0] += dx;
        translation[1] += dy;
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    canvas.addEventListener('mouseup', () => {
      isDragging = false;
    });

    canvas.addEventListener('mouseleave', () => {
      isDragging = false;
    });

    // Zoom slider
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomValue = document.getElementById('zoomValue');
    zoomSlider.addEventListener('input', (e) => {
      scale = parseFloat(e.target.value);
      zoomValue.textContent = scale.toFixed(1);
    });

    // Render loop
    function render() {
      gl.clearColor(0.9, 0.9, 0.9, 1.0); // Light gray background
      gl.clear(gl.COLOR_BUFFER_BIT);

      // Set uniforms
      gl.uniform2fv(translationLoc, translation);
      gl.uniform1f(scaleLoc, scale);

      // Draw sine wave (blue)
      gl.bindBuffer(gl.ARRAY_BUFFER, sineBuffer);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);
      gl.uniform3f(colorLoc, 0.0, 0.0, 1.0); // Blue
      gl.drawArrays(gl.LINE_STRIP, 0, numPoints);

      // Draw axes (black)
      gl.bindBuffer(gl.ARRAY_BUFFER, axisBuffer);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);
      gl.uniform3f(colorLoc, 0.0, 0.0, 0.0); // Black
      gl.drawArrays(gl.LINES, 0, 4); // 2 lines (x and y)

      requestAnimationFrame(render);
    }

    // Start rendering
    render();
  </script>
</body>
</html>
