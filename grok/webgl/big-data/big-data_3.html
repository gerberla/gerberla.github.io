<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Marble with Population Density</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1a;
    }
    #glCanvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>
  <script>
    // Canvas and WebGL setup
    const canvas = document.getElementById('glCanvas');
    const gl = canvas.getContext('webgl');
    if (!gl) {
      alert('WebGL not supported!');
      throw new Error('WebGL not supported');
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Shaders
    const vertexShaderSource = `
      attribute vec2 a_position;
      attribute vec2 a_texCoord;
      uniform mat4 u_mvp;
      varying vec2 v_texCoord;
      void main() {
        gl_Position = u_mvp * vec4(a_position, 0.0, 1.0);
        v_texCoord = a_texCoord;
      }
    `;

    const fragmentShaderSource = `
      precision mediump float;
      varying vec2 v_texCoord;
      uniform sampler2D u_texture;
      uniform int u_layer; // 0 = Blue Marble, 1 = Heatmap
      void main() {
        vec4 color = texture2D(u_texture, v_texCoord);
        if (u_layer == 0) {
          // Blue Marble simulation
          float land = step(0.5, sin(v_texCoord.x * 50.0) * sin(v_texCoord.y * 25.0) + 0.2);
          vec3 ocean = vec3(0.0, 0.2, 0.5); // Blue
          vec3 landColor = vec3(0.1, 0.5, 0.1); // Green
          gl_FragColor = vec4(mix(ocean, landColor, land), 1.0);
        } else {
          // Heatmap: semi-transparent red-orange
          gl_FragColor = vec4(color.r, color.g * 0.5, 0.0, color.r * 0.5); // Alpha from intensity
        }
      }
    `;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('Program error:', gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    // Pyramid data (population density)
    function generateDensityTexture(width, height) {
      const data = new Uint8Array(width * height * 4);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const lat = (y / height) * 180 - 90; // -90 to 90
          const lon = (x / width) * 360 - 180; // -180 to 180
          const density = Math.max(0, Math.cos(lat * Math.PI / 180)) * 0.8 + Math.random() * 0.2;
          data[i] = Math.min(255, density * 255);     // R (intensity)
          data[i + 1] = Math.min(255, density * 100); // G (less intense)
          data[i + 2] = 0;                            // B
          data[i + 3] = 255;                          // A (full opacity in texture)
        }
      }
      return data;
    }

    const pyramid = {
      low: { width: 1024, height: 512, data: generateDensityTexture(1024, 512) },
      mid: [
        { width: 1024, height: 512, data: generateDensityTexture(1024, 512), x: 0, y: 0 },
        { width: 1024, height: 512, data: generateDensityTexture(1024, 512), x: 0.5, y: 0 },
        { width: 1024, height: 512, data: generateDensityTexture(1024, 512), x: 0, y: 0.5 },
        { width: 1024, height: 512, data: generateDensityTexture(1024, 512), x: 0.5, y: 0.5 }
      ],
      high: Array(16).fill().map((_, i) => ({
        width: 1024, height: 512,
        data: generateDensityTexture(1024, 512),
        x: (i % 4) * 0.25,
        y: Math.floor(i / 4) * 0.25
      }))
    };

    // Placeholder Blue Marble texture (low-res only for demo)
    const blueMarble = {
      width: 1024,
      height: 512,
      data: new Uint8Array(1024 * 512 * 4).fill(255) // Dummy data, shader generates the map
    };

    function createTexture(data, width, height) {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return texture;
    }

    blueMarble.texture = createTexture(blueMarble.data, blueMarble.width, blueMarble.height);
    pyramid.low.texture = createTexture(pyramid.low.data, pyramid.low.width, pyramid.low.height);
    pyramid.mid.forEach(chunk => chunk.texture = createTexture(chunk.data, chunk.width, chunk.height));
    pyramid.high.forEach(chunk => chunk.texture = createTexture(chunk.data, chunk.width, chunk.height));

    // Buffers
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      0, 0,  1, 0,  0, 1,  1, 1 // Quad from (0,0) to (1,1)
    ]), gl.STATIC_DRAW);

    const texCoordBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      0, 1,  1, 1,  0, 0,  1, 0 // Texture coords
    ]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    const texCoordLoc = gl.getAttribLocation(program, 'a_texCoord');
    const mvpLoc = gl.getUniformLocation(program, 'u_mvp');
    const layerLoc = gl.getUniformLocation(program, 'u_layer');

    // Interaction
    let zoom = 1;
    let panX = 0.5;
    let panY = 0.5;
    let isDragging = false;
    let lastX, lastY;

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
      const mouseX = e.clientX / canvas.width;
      const mouseY = 1 - e.clientY / canvas.height;
      const newZoom = Math.max(1, Math.min(16, zoom * zoomFactor));
      const worldX = panX + (mouseX - 0.5) / zoom;
      const worldY = panY + (mouseY - 0.5) / zoom;
      panX = worldX - (mouseX - 0.5) / newZoom;
      panY = worldY - (mouseY - 0.5) / newZoom;
      zoom = newZoom;
    });

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = (e.clientX - lastX) / canvas.width / zoom;
        const dy = (lastY - e.clientY) / canvas.height / zoom;
        panX -= dx;
        panY -= dy;
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    canvas.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('mouseleave', () => isDragging = false);

    // Matrix function
    function ortho(left, right, bottom, top, near, far) {
      const lr = 1 / (left - right);
      const bt = 1 / (bottom - top);
      const nf = 1 / (near - far);
      return [
        -2 * lr, 0, 0, 0,
        0, -2 * bt, 0, 0,
        0, 0, 2 * nf, 0,
        (left + right) * lr, (bottom + top) * bt, (far + near) * nf, 1
      ];
    }

    // Render
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    function render() {
      gl.clearColor(0.1, 0.1, 0.1, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      const aspect = canvas.width / canvas.height;
      const visibleWidth = 1 / zoom;
      const visibleHeight = visibleWidth / aspect;
      const left = panX - visibleWidth / 2;
      const right = panX + visibleWidth / 2;
      const bottom = panY - visibleHeight / 2;
      const top = panY + visibleHeight / 2;
      const mvp = ortho(left, right, bottom, top, -1, 1);

      gl.uniformMatrix4fv(mvpLoc, false, mvp);

      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(positionLoc);

      gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
      gl.vertexAttribPointer(texCoordLoc, 2, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(texCoordLoc);

      // Draw Blue Marble base layer
      gl.uniform1i(layerLoc, 0);
      gl.bindTexture(gl.TEXTURE_2D, blueMarble.texture);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // Draw population density heatmap
      gl.uniform1i(layerLoc, 1);
      let level = pyramid.low;
      if (zoom > 4) level = pyramid.high;
      else if (zoom > 2) level = pyramid.mid;

      if (Array.isArray(level)) {
        level.forEach(chunk => {
          const chunkLeft = chunk.x;
          const chunkRight = chunk.x + (zoom > 4 ? 0.25 : 0.5);
          const chunkBottom = chunk.y;
          const chunkTop = chunk.y + (zoom > 4 ? 0.25 : 0.5);
          if (chunkRight > left && chunkLeft < right && chunkTop > bottom && chunkBottom < top) {
            gl.bindTexture(gl.TEXTURE_2D, chunk.texture);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
        });
      } else {
        gl.bindTexture(gl.TEXTURE_2D, level.texture);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
