<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLB Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; }
        canvas { display: block; }
        .controls { margin-top: 10px; }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept=".glb">
    <div id="container" style="width: 80vw; height: 60vh;"></div>
    <div class="controls">
        <label>Rotation X: <input type="range" id="rotateX" min="-180" max="180" value="0"></label>
        <label>Rotation Y: <input type="range" id="rotateY" min="-180" max="180" value="0"></label>
        <label>Rotation Z: <input type="range" id="rotateZ" min="-180" max="180" value="0"></label>
    </div>
    <script>
        let scene, camera, renderer, controls, model;
        const container = document.getElementById("container");

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const light = new THREE.AmbientLight(0xffffff, 1);
        scene.add(light);

        document.getElementById("fileInput").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(e.target.result, "", function(gltf) {
                        if (model) scene.remove(model);
                        model = gltf.scene;
                        scene.add(model);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function updateSliders() {
            if (!model) return;
            document.getElementById("rotateX").value = THREE.MathUtils.radToDeg(model.rotation.x);
            document.getElementById("rotateY").value = THREE.MathUtils.radToDeg(model.rotation.y);
            document.getElementById("rotateZ").value = THREE.MathUtils.radToDeg(model.rotation.z);
        }

        controls.addEventListener("change", updateSliders);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function updateRotation() {
            if (!model) return;
            model.rotation.x = THREE.MathUtils.degToRad(document.getElementById("rotateX").value);
            model.rotation.y = THREE.MathUtils.degToRad(document.getElementById("rotateY").value);
            model.rotation.z = THREE.MathUtils.degToRad(document.getElementById("rotateZ").value);
        }

        document.getElementById("rotateX").addEventListener("input", updateRotation);
        document.getElementById("rotateY").addEventListener("input", updateRotation);
        document.getElementById("rotateZ").addEventListener("input", updateRotation);
    </script>
</body>
</html>
